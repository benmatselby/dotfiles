# https://github.com/dlvhdr/gh-dash/blob/main/.gh-dash.yml
prSections:
  - title: My projects
    filters: is:open user:@me
  - title: My pull requests
    filters: is:open author:@me
  - title: Needs my review
    filters: is:open -is:draft -label:no-mkt-alert review-requested:@me
  - title: Approved not merged
    filters: is:open review:approved reviewed-by:@me
  - title: Involved
    filters: is:open -is:draft involves:@me -author:@me
  - title: Team deployments
    filters: is:pr is:merged closed:2026-11-23..2026-11-29 org:prolific-oss mkt in:title

issuesSections:
  - title: My issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
  - title: Issues on my repos
    filters: is:open user:benmatselby -author:@me
  - title: My issues at work
    filters: is:open org:prolific-oss author:@me

notificationsSections:
  - title: All
    filters: ""
  - title: Unread
    filters: "is:unread"
  - title: Created
    filters: "is:unread reason:author"
  - title: Review requested
    filters: "is:unread reason:review-requested"
  - title: Participating
    filters: "is:unread reason:participating"

defaults:
  preview:
    open: true
    width: 75
  prsLimit: 50
  issuesLimit: 50
  notificationsLimit: 50
  view: notifications
  refetchIntervalMinutes: 30

keybindings:
  prs:
    - key: C
      name: tuicr
      command: >
        cd {{.RepoPath}} &&
        tuicr tui pr {{.RepoName}}#{{.PrNumber}}
    - key: T
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
  notifications:
    - key: d
      builtin: markAsDone
    - key: D
      builtin: markAllAsDone

repoPaths:
  benmatselby/*: ~/git/github/benmatselby/*
  prolific-oss/*: ~/git/github/prolific-oss/*
